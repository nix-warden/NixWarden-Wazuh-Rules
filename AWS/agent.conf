<!-- centralised config -->
  <agent_config os="Linux">
    <localfile>
      <location>/var/log/amazon/ssm/amazon-ssm-agent.log</location>
      <log_format>multiline</log_format>
      <multiline_regex replace="wspace">^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}</multiline_regex>
    </localfile>
  </agent_config>

<!-- local config -->
  <localfile>
    <location>/var/log/amazon/ssm/amazon-ssm-agent.log</location>
    <log_format>multiline</log_format>
    <multiline_regex replace="wspace">^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}</multiline_regex>
  </localfile>