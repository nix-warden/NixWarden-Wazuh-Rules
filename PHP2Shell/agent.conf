<!-- 
  NixWarden - Multi-Vector Agent Configuration for PHP2Shell Detection
  Location on Manager: /var/ossec/etc/shared/default/agent.conf (centralized)
  Or on Agent: /var/ossec/etc/ossec.conf (local endpoint configuration)
-->
<agent_config os="Linux">

  <!-- ======================================================= -->
  <!-- Vector 1 & 2: Web Server Error & Access Log Ingestion   -->
  <!-- ======================================================= -->

  <!-- Nginx Logs (Debian/Ubuntu/RHEL) -->
  <localfile>
    <location>/var/log/nginx/error.log</location>
    <log_format>apache</log_format>
  </localfile>

  <localfile>
    <location>/var/log/nginx/access.log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- Apache HTTP Server Logs (Debian/Ubuntu) -->
  <localfile>
    <location>/var/log/apache2/error.log</location>
    <log_format>apache</log_format>
  </localfile>

  <localfile>
    <location>/var/log/apache2/access.log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- Apache HTTP Server Logs (RHEL/CentOS/Rocky/Alma) -->
  <localfile>
    <location>/var/log/httpd/error_log</location>
    <log_format>apache</log_format>
  </localfile>

  <localfile>
    <location>/var/log/httpd/access_log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- PHP-FPM Error Logs (All distros & versions) -->
  <localfile>
    <location>/var/log/php*-fpm.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <location>/var/log/php-fpm/www-error.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- ======================================================= -->
  <!-- Vector 3: Linux Auditd Subsystem Log Ingestion          -->
  <!-- ======================================================= -->

  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>auditd</log_format>
  </localfile>

  <!-- ======================================================= -->
  <!-- Vector 4: File Integrity Monitoring (FIM / syscheck)    -->
  <!-- ======================================================= -->

  <syscheck>
    <!-- Real-time monitoring for Web Root directory -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/html</directories>
    <directories realtime="yes" check_all="yes">/var/www</directories>
    
    <!-- Monitor temporary staging directories commonly abused by web shells -->
    <directories realtime="yes" check_all="yes">/tmp,/dev/shm</directories>

    <!-- Scan frequency for scheduled integrity checks (in seconds: 12 hours) -->
    <frequency>43200</frequency>
  </syscheck>

</agent_config>
