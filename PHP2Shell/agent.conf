<!-- 
  NixWarden - Agent Configuration for PHP2Shell Detection
  Location on Manager: /var/ossec/etc/shared/default/agent.conf (centralized)
  Or on Agent: /var/ossec/etc/ossec.conf (local)
-->
<agent_config os="Linux">

  <!-- ======================================================= -->
  <!-- 1. Web Server Error Log Ingestion                       -->
  <!-- ======================================================= -->

  <!-- Apache HTTP Server Error Log (Debian/Ubuntu) -->
  <localfile>
    <location>/var/log/apache2/error.log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- Apache HTTP Server Error Log (RHEL/CentOS/Rocky) -->
  <localfile>
    <location>/var/log/httpd/error_log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- PHP-FPM Error Log -->
  <localfile>
    <location>/var/log/php*-fpm.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- ======================================================= -->
  <!-- 2. Linux Auditd Subsystem Log Ingestion                -->
  <!-- ======================================================= -->

  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>auditd</log_format>
  </localfile>

  <!-- ======================================================= -->
  <!-- 3. File Integrity Monitoring (FIM / syscheck)           -->
  <!-- ======================================================= -->

  <syscheck>
    <directories realtime="yes" check_all="yes">/var/www/html</directories>
    <directories realtime="yes" check_all="yes">/tmp</directories>
  </syscheck>

</agent_config>
