title: PHP2Shell C2 - Outbound Network or Reverse Shell Utility Spawned by Web User
id: f1b33ff9-a82f-47c2-9d51-682f6032b261
status: experimental
description: |
    Detects outbound network communication, reverse shell listeners, or remote file transfer utilities
    (nc, socat, curl, wget, chisel) executed under web server service accounts (UID 33, 48, 82, www-data, apache, nginx).
references:
    - https://wazuh.com/blog/detecting-php2shell-remote-code-execution-with-wazuh/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
author: NixWarden / Wazuh Ruleset
date: 2026/10/31
modified: 2026/10/31
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.t1105
    - attack.t1571
    - ckc.command_and_control
    - php2shell
logsource:
    category: process_creation
    product: linux
detection:
    selection_user_id:
        user.effective.id:
            - 33
            - 48
            - 82
    selection_user_name:
        user.effective.name:
            - 'www-data'
            - 'apache'
            - 'nginx'
            - 'nobody'
    selection_binary:
        process.executable|endswith:
            - '/nc'
            - '/netcat'
            - '/ncat'
            - '/socat'
            - '/curl'
            - '/wget'
            - '/telnet'
            - '/chisel'
    condition: (selection_user_id or selection_user_name) and selection_binary
falsepositives:
    - Custom PHP application scripts invoking curl/wget as CLI binaries rather than native PHP libcurl extensions.
level: high

