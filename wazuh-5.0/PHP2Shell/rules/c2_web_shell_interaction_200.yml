title: PHP2Shell C2 - Direct HTTP 200 Execution of Script in Upload Directory
id: 7c131c82-9c4c-4871-bc59-3496d664e88f
status: experimental
description: |
    Detects successful HTTP 200 responses to requests targeting PHP scripts residing inside designated
    upload, static asset, or cache directories (/uploads, /images, /tmp), indicating direct interaction with dropped web shells.
references:
    - https://wazuh.com/blog/detecting-php2shell-remote-code-execution-with-wazuh/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
author: NixWarden / Wazuh Ruleset
date: 2026/10/31
modified: 2026/10/31
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.command_and_control
    - attack.t1071.001
    - attack.initial_access
    - attack.t1190
    - ckc.command_and_control
    - php2shell
logsource:
    category: webserver
detection:
    selection_status:
        http.response.status_code: 200
    selection_path:
        url.path|re: '(?i)/(?:uploads?|wp-content/uploads|images?|media|tmp|cache)/.*?\.(?:php|phtml|phar)\b'
    condition: selection_status and selection_path
falsepositives:
    - Misconfigured CMS plugins storing functional front-controller PHP scripts directly inside upload directories.
level: high

