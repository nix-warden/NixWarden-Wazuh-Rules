title: PHP2Shell Installation - Suspicious Script Created or Modified in Web Root
id: 96292cfd-9c84-48bd-8beb-31109ed52f4b
status: experimental
description: |
    Detects creation or modification of executable PHP/script files in web directories (/var/www, /usr/share/nginx/html)
    or shared memory/temp areas (/tmp, /dev/shm) via Wazuh File Integrity Monitoring (FIM / Syscheck).
references:
    - https://wazuh.com/blog/detecting-php2shell-remote-code-execution-with-wazuh/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
author: NixWarden / Wazuh Ruleset
date: 2026/10/31
modified: 2026/10/31
tags:
    - attack.persistence
    - attack.t1505.003
    - ckc.installation
    - php2shell
logsource:
    category: file_event
detection:
    selection_path:
        file.path|re: '^/(?:var/www|usr/share/nginx/html|srv/www|srv/http|tmp|dev/shm)/.*?\.(?:php[0-9]?|phtml|phar|so|inc)$'
    selection_action:
        event.action:
            - 'created'
            - 'modified'
            - 'file_created'
            - 'file_modified'
            - 'added'
    condition: selection_path and selection_action
falsepositives:
    - Legitimate CI/CD code deployments, CMS automatic background updates (WordPress, Drupal, Joomla).
level: high

