title: PHP2Shell Delivery - PHP Execution Timeout Exceeded
id: 7df01780-4672-4c37-b16f-58cedc6026aa
status: experimental
description: |
    Detects PHP maximum execution time exhaustion events resulting from complex regular expression
    backtracking, recursive payload parsing, or heap stall maneuvers during PHP2Shell exploitation.
references:
    - https://wazuh.com/blog/detecting-php2shell-remote-code-execution-with-wazuh/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
author: NixWarden / Wazuh Ruleset
date: 2026/10/31
modified: 2026/10/31
tags:
    - attack.initial_access
    - attack.t1190
    - ckc.delivery
    - php2shell
logsource:
    category: application
    product: php
detection:
    selection_keyword:
        message|contains: 'Maximum execution time of '
    selection_regex:
        message|re: 'Maximum execution time of \d+ seconds? exceeded'
    condition: selection_keyword and selection_regex
falsepositives:
    - Heavy report generation, third-party API timeout waits, or slow database queries in legacy scripts.
level: low

