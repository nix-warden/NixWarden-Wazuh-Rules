title: PHP2Shell Delivery - Web Server FastCGI Backend Death or Timeout (502/504)
id: d95b7dc1-c690-4404-940f-c615ee6cef52
status: experimental
description: |
    Detects HTTP 502 (Bad Gateway) or 504 (Gateway Timeout) responses generated by reverse proxies
    (Nginx, Apache, Traefik) when a PHP-FPM backend worker unexpectedly crashes or hangs during exploit delivery.
references:
    - https://wazuh.com/blog/detecting-php2shell-remote-code-execution-with-wazuh/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
author: NixWarden / Wazuh Ruleset
date: 2026/10/31
modified: 2026/10/31
tags:
    - attack.initial_access
    - attack.t1190
    - ckc.delivery
    - php2shell
logsource:
    category: webserver
detection:
    selection:
        http.response.status_code:
            - 502
            - 504
    condition: selection
falsepositives:
    - Backend maintenance windows, service restarts, upstream network partitions, or resource starvation.
level: low

