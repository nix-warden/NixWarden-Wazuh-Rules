title: PHP2Shell Delivery - Fatal PHP Memory Exhaustion
id: 91414b3d-eded-46e7-abe2-edaba1580b7c
status: experimental
description: |
    Detects single fatal PHP memory exhaustion errors often triggered during initial heap spraying
    or multipart boundary payload manipulation in PHP2Shell (CVE-2026-109618, CVE-2026-109619).
references:
    - https://wazuh.com/blog/detecting-php2shell-remote-code-execution-with-wazuh/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
author: NixWarden / Wazuh Ruleset
date: 2026/10/31
modified: 2026/10/31
tags:
    - attack.initial_access
    - attack.t1190
    - attack.impact
    - attack.t1499.003
    - ckc.delivery
    - php2shell
logsource:
    category: application
    product: php
detection:
    selection_keyword:
        message|contains: 'Allowed memory size of '
    selection_regex:
        message|re: 'Allowed memory size of \d+ bytes exhausted'
    condition: selection_keyword and selection_regex
falsepositives:
    - Legitimate resource-heavy PHP cron jobs, large database batch queries, or unoptimized image transformations.
level: low

